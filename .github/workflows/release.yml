name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      strict_signing: ${{ steps.meta.outputs.strict_signing }}
    steps:
      - id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "strict_signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "strict_signing=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    name: Build Windows
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
      HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Require Windows signing for stable releases
        if: needs.prepare.outputs.strict_signing == 'true' && (env.HAS_WINDOWS_CERTIFICATE != 'true' || env.HAS_WINDOWS_CERTIFICATE_PASSWORD != 'true')
        shell: bash
        run: |
          echo "Stable Windows releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD." >&2
          exit 1

      - name: Build release assets
        shell: bash
        run: |
          pnpm build
          pnpm exec electron-builder --publish never --config.publish.channel="${UPDATE_CHANNEL}"
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.prepare.outputs.strict_signing == 'true' && 'true' || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          INSTALLERS=(release/*.exe)
          BLOCKMAPS=(release/*.exe.blockmap)
          if [[ "${#INSTALLERS[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows installer, found ${#INSTALLERS[@]}." >&2
            exit 1
          fi
          if [[ "${#BLOCKMAPS[@]}" -ne 1 ]]; then
            echo "Expected exactly one blockmap, found ${#BLOCKMAPS[@]}." >&2
            exit 1
          fi
          test -f "release/${UPDATE_CHANNEL}.yml"
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Publish GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          RELEASE_FILES=(release/*.exe release/*.exe.blockmap "release/${UPDATE_CHANNEL}.yml")
          RELEASE_ARGS=(release create "${GITHUB_REF_NAME}" "${RELEASE_FILES[@]}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "文书比对 ${GITHUB_REF_NAME}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh "${RELEASE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktopapp-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
          if-no-files-found: error
