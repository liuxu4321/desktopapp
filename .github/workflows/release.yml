name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_type: ${{ steps.meta.outputs.release_type }}
      strict_signing: ${{ steps.meta.outputs.strict_signing }}
    steps:
      - id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
            echo "strict_signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_type=release" >> "$GITHUB_OUTPUT"
            echo "strict_signing=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    name: Build Windows
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
      HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Require Windows signing for stable releases
        if: needs.prepare.outputs.strict_signing == 'true' && (env.HAS_WINDOWS_CERTIFICATE != 'true' || env.HAS_WINDOWS_CERTIFICATE_PASSWORD != 'true')
        shell: bash
        run: |
          echo "Stable Windows releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD." >&2
          exit 1

      - name: Build and publish
        shell: bash
        run: |
          pnpm build
          pnpm exec electron-builder --publish always --config.publish.releaseType="${RELEASE_TYPE}" --config.publish.channel="${UPDATE_CHANNEL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.prepare.outputs.strict_signing == 'true' && 'true' || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktopapp-windows
          path: release/**
          if-no-files-found: error
